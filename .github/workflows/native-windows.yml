name: Native Windows 11 Registrar CI
on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build -A x64
      - name: Build
        run: cmake --build native/build --config Release
      - name: Publish registrar artifact
        uses: actions/upload-artifact@v4
        with:
          name: BDFRVCamRegistrar-win-x64
          path: native/build/Release/BDFRVCamRegistrar.exe
          if-no-files-found: error
      - name: Publish frame bridge probe
        uses: actions/upload-artifact@v4
        with:
          name: BDFRFrameBridgeProbe-win-x64
          path: native/build/Release/BDFRFrameBridgeProbe.exe
          if-no-files-found: error
